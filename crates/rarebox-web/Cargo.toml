[package]
name = "rarebox-web"
version = "0.2.0"
edition = "2024"
description = "RareBox Web — ADB over WebUSB browser client"
license = "AGPL-3.0-only"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
anyhow = "1"
base64 = "0.22"
rand = "0.8"
rsa = { version = "0.9.10", features = ["sha1"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = { version = "0.10", features = ["oid"] }

# 浏览器目标：WebUSB 走 web-sys，异步桥接走 wasm-bindgen。
# `navigator.usb` 目前仍受 `web_sys_unstable_apis` 控制，见 .cargo/config.toml。
[target.'cfg(target_family = "wasm")'.dependencies]
console_error_panic_hook = "0.1"
getrandom = { version = "0.2", features = ["js"] }
futures = "0.3"
js-sys = "0.3"
wasm-bindgen = "=0.2.130"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
    "Blob",
    "Document",
    "Element",
    "HtmlElement",
    "Navigator",
    "Storage",
    "Usb",
    "UsbAlternateInterface",
    "UsbConfiguration",
    "UsbDevice",
    "UsbDeviceFilter",
    "UsbDeviceRequestOptions",
    "UsbDirection",
    "UsbEndpoint",
    "UsbEndpointType",
    "UsbInTransferResult",
    "UsbInterface",
    "UsbOutTransferResult",
    "UsbTransferStatus",
    "Window",
] }

[dev-dependencies]
futures = "0.3"
serde_json = "1"
