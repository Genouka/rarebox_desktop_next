[package]
name = "rarebox-core"
version = "0.2.0"
edition = "2024"
description = "RareBox device engine (headless, UI-agnostic)"
license = "AGPL-3.0-only"

[dependencies]
anyhow = "1"
async-channel = "2"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
fadb-scrcpy = "0.8.12"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
hapsigner = { path = "../../vendor/hapsigner", default-features = false }
rand = "0.8"
scrcpy-protocol = "0.1.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
ureq = { version = "2", default-features = false, features = ["tls", "rustls", "json"] }
x509-cert = { version = "0.2", features = ["pem"] }
der = { version = "0.7", features = ["pem", "std"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
