[package]
name = "rarebox-ohos"
version = "0.1.0"
edition = "2024"
description = "RareBox Desktop —— HarmonyOS (OpenHarmony) Node-API 宿主"
license = "AGPL-3.0-only"
publish = false

[lib]
name = "rarebox_ohos"
crate-type = ["cdylib"]

[dependencies]
rarebox-core = { path = "../rarebox-core" }
# 复用 C ABI / JNI 宿主已经使用的 camelCase 状态 JSON（rarebox_ffi::state_json），
# 不为鸿蒙再建一套状态序列化约定。rarebox-ffi 在非 Android 目标上不启用 jni。
rarebox-ffi = { path = "../rarebox-ffi" }
serde_json = "1"

# Node-API 绑定只在 OHOS 上启用；桌面/Android/iOS 构建该 crate 时退化为空库，
# 这样 `cargo check --workspace` 不会把 napi 依赖带进其他平台。
# `napi4` 是 ThreadSafeFunction（事件回调）所需的最低 Node-API 版本。
[target.'cfg(target_env = "ohos")'.dependencies]
napi-ohos = { version = "1", default-features = false, features = ["napi4"] }
napi-derive-ohos = "1"

# build.rs 在宿主上编译，目标三元组由 CARGO_CFG_TARGET_ENV 判断；因此这里不能
# 写成 target.'cfg(target_env = "ohos")'.build-dependencies，否则非 OHOS 目标
# 编译 build.rs 时找不到该 crate。
[build-dependencies]
napi-build-ohos = "1"
