name: Linux

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: linux

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential pkg-config cmake nasm perl clang libclang-dev \
            libssl-dev libuv1-dev libusb-1.0-0-dev liblz4-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libx11-dev libx11-xcb-dev \
            libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxcb-util-dev libfontconfig1-dev libfreetype6-dev \
            libglib2.0-dev libdbus-1-dev libvulkan-dev \
            libasound2-dev libpulse-dev

      - name: Build bundled hdc
        run: ./script/build_hdc.sh linux
        env:
          PKG_CONFIG_PATH: /usr/lib/x86_64-linux-gnu/pkgconfig

      - name: Build
        run: cargo build --release --bin rarebox-desktop

      - name: Package
        run: ./script/package_linux.sh

      - uses: actions/upload-artifact@v4
        with:
          name: rarebox-desktop-linux
          path: dist/*.tar.gz
          if-no-files-found: error
