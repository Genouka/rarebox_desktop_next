name: hdc

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    tags: ["v*"]
    paths:
      - "vendor/hdc/**"
      - "script/build_hdc.sh"
      - "script/fetch_hdc_android_deps.sh"
      - "script/patch_android_hdc_libs.py"
      - ".github/workflows/hdc.yml"

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev libuv1-dev libusb-1.0-0-dev liblz4-dev
      - name: Build hdc
        run: ./script/build_hdc.sh linux
      - uses: actions/upload-artifact@v4
        with:
          name: hdc-linux
          path: vendor/hdc/linux/
          if-no-files-found: error

  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: brew install openssl@3 libuv libusb lz4 pkg-config
      - name: Build hdc
        run: ./script/build_hdc.sh macos
        env:
          PKG_CONFIG_PATH: ${{ env.HOMEBREW_PREFIX }}/opt/openssl@3/lib/pkgconfig:${{ env.HOMEBREW_PREFIX }}/opt/libuv/lib/pkgconfig:${{ env.HOMEBREW_PREFIX }}/opt/libusb/lib/pkgconfig:${{ env.HOMEBREW_PREFIX }}/opt/lz4/lib/pkgconfig
      - uses: actions/upload-artifact@v4
        with:
          name: hdc-macos
          path: vendor/hdc/macos/
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install MinGW + OpenSSL
        shell: pwsh
        run: choco install strawberryperl -y --no-progress
      - name: Build hdc
        shell: bash
        run: ./script/build_hdc.sh windows
      - uses: actions/upload-artifact@v4
        with:
          name: hdc-windows
          path: vendor/hdc/windows/
          if-no-files-found: error

  android:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"
      - name: Install NDK
        run: sdkmanager --install "ndk;27.2.12479018"
      - name: Build libhdc.so
        run: ./script/build_hdc.sh android arm64-v8a x86_64
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.2.12479018
      - uses: actions/upload-artifact@v4
        with:
          name: hdc-android
          path: android/app/src/main/jniLibs/
          if-no-files-found: error
