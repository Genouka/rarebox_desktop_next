name: macOS

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    tags: ["v*"]

jobs:
  build:
    # Apple Silicon runner：同时构建 arm64 与 x86_64，再 lipo 成通用二进制。
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          key: macos
      - name: Install hdc dependencies
        run: brew install openssl@3 libuv libusb lz4 pkg-config
      - name: Build bundled hdc
        run: ./script/build_hdc.sh macos
        env:
          PKG_CONFIG_PATH: ${{ env.HOMEBREW_PREFIX }}/opt/openssl@3/lib/pkgconfig:${{ env.HOMEBREW_PREFIX }}/opt/libuv/lib/pkgconfig:${{ env.HOMEBREW_PREFIX }}/opt/libusb/lib/pkgconfig:${{ env.HOMEBREW_PREFIX }}/opt/lz4/lib/pkgconfig
      - name: Build universal app
        run: ./script/package_macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: rarebox-desktop-macos-universal
          path: dist/*.zip
          if-no-files-found: error
