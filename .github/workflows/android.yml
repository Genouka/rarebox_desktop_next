name: Android

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v3
        with:
          # Recent SDK repos no longer provide the legacy `tools` package.
          packages: "platform-tools"

      - name: Install NDK and SDK packages
        run: |
          sdkmanager --install \
            "ndk;27.2.12479018" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          key: android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Build APK
        run: ./script/package_android.sh release
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.2.12479018

      - uses: actions/upload-artifact@v4
        with:
          name: rarebox-desktop-android
          path: dist/*.apk
          if-no-files-found: error
